<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mixbox DJ</title>
<style>
:root{--bg:#0c0c0f;--p:#16161b;--p2:#202027;--p3:#2a2a33;--bd:#2d2d37;--tx:#dcdce4;--mut:#8b8b9a;--a1:#2f8cff;--a2:#ff8a1f;--cue:#ffa21f;--play:#2bd665;--red:#ff3b4f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--p2);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
button:hover{border-color:#44444f}
button.on{background:var(--a1);border-color:var(--a1);color:#fff}
select,input[type=text],input[type=search],input[type=number]{background:var(--p2);border:1px solid var(--bd);border-radius:5px;padding:5px 6px}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#07070a;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:2px;font-size:15px;margin-right:6px}.logo span{color:var(--a1)}
.hgrp{display:inline-flex;align-items:center;gap:3px;color:var(--mut)}
.mbpm{margin-left:auto;color:var(--mut)}.mbpm b{color:#fff;font-size:14px;font-variant-numeric:tabular-nums}
button.rec.on{background:var(--red);border-color:var(--red)}
#recT{font-variant-numeric:tabular-nums;color:var(--red);min-width:44px}
.waves canvas{display:block;width:100%;height:84px;background:#09090c;border-bottom:1px solid var(--bd);touch-action:none;cursor:grab}
.main{display:grid;grid-template-columns:1fr 330px 1fr;gap:6px;padding:6px}
.deck,.mixer,.fxu,.sampler{background:var(--p);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
.deck.drop{outline:2px dashed var(--a1)}
.dhead{display:flex;align-items:center;gap:8px}
.dnum{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;font-weight:800;color:#fff}
#deck1 .dnum{background:var(--a1)}#deck2 .dnum{background:var(--a2)}
.dinfo{flex:1;min-width:0}.dtitle{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dartist{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkey{font-weight:700;padding:3px 6px;border-radius:4px;background:var(--p2);min-width:40px;text-align:center}
.dbpm{text-align:right}.dbpm b{font-size:18px;font-variant-numeric:tabular-nums;display:block}.dbpm small{color:var(--mut);font-variant-numeric:tabular-nums}
.dstat{display:flex;align-items:center;justify-content:space-between;margin:6px 0 4px;font-variant-numeric:tabular-nums;font-size:13px}
.beats{display:inline-flex;gap:3px}.beats i{width:14px;height:8px;border-radius:2px;background:var(--p3);display:block}.beats i.on{background:var(--red)}.beats i.on.b1{background:#fff}
.ov{display:block;width:100%;height:46px;background:#09090c;border-radius:4px;touch-action:none;cursor:pointer}
.dbody{display:grid;grid-template-columns:1fr 70px;gap:8px;margin-top:8px;align-items:stretch}
.jogwrap{display:flex;justify-content:center;align-items:center}
.jog{width:100%;max-width:210px;aspect-ratio:1;touch-action:none;cursor:grab}
.tempo{display:flex;flex-direction:column;align-items:center;gap:4px}
.tempo .vf{flex:1;min-height:120px}
.tempo button{padding:3px 4px;width:100%;font-size:10px}
.bend{display:flex;gap:3px;width:100%}
.tpct{font-variant-numeric:tabular-nums;font-size:11px}
.transport{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-top:8px}
.transport button{padding:9px 4px;font-weight:700}
button.cue{border-color:var(--cue);color:var(--cue)}button.cue.on{background:var(--cue);color:#000}
button.play{border-color:var(--play);color:var(--play)}button.play.on{background:var(--play);color:#000}
button.sync.on{background:#18b4ff;border-color:#18b4ff;color:#000}
button.mst.on{background:#ffd32a;border-color:#ffd32a;color:#000}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.pads button{padding:10px 2px;font-weight:700;position:relative;overflow:hidden}
.pads button.set{color:#000}
.row{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;align-items:center}
.row button{flex:1;padding:6px 2px;font-size:11px}
.row .lbl{color:var(--mut);font-size:10px;min-width:30px;text-align:center}
.row .val{min-width:34px;text-align:center;font-weight:700}
button.loopon{background:#2bd665;color:#000;border-color:#2bd665}
.mixer{display:grid;grid-template-columns:1fr 64px 1fr;gap:6px}
.mch,.mmst{display:flex;flex-direction:column;align-items:center;gap:4px}
.mch h4,.mmst h4{margin:0;font-size:11px;color:var(--mut)}
.knob{display:flex;flex-direction:column;align-items:center;cursor:ns-resize;touch-action:none;width:48px}
.knob svg{width:40px;height:40px}.knob span{font-size:9px;color:var(--mut);margin-top:-2px}
.knob .kb{fill:#25252d;stroke:#3a3a45;stroke-width:1.5}.knob .ka{fill:none;stroke:var(--a1);stroke-width:3;stroke-linecap:round}.knob .kp{stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.fvu{display:flex;gap:6px;height:150px;margin-top:4px}
.vf{position:relative;width:30px;touch-action:none;cursor:ns-resize}
.vf .ft{position:absolute;left:50%;top:6px;bottom:6px;width:4px;margin-left:-2px;background:#000;border-radius:2px}
.vf .fc{position:absolute;left:0;right:0;height:22px;background:linear-gradient(#55555f,#2b2b33);border:1px solid #666;border-radius:3px}
.vf .fc:after{content:"";position:absolute;left:3px;right:3px;top:10px;height:2px;background:#fff}
.hf{position:relative;height:30px;touch-action:none;cursor:ew-resize;flex:1}
.hf .ft{position:absolute;top:50%;left:6px;right:6px;height:4px;margin-top:-2px;background:#000;border-radius:2px}
.hf .fc{position:absolute;top:2px;bottom:2px;width:26px;background:linear-gradient(90deg,#55555f,#2b2b33);border:1px solid #666;border-radius:3px}
.hf .fc:after{content:"";position:absolute;top:3px;bottom:3px;left:12px;width:2px;background:#fff}
.vu{width:10px;height:100%;background:#000;border-radius:2px}
.xfrow{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin-top:4px}
.cuebtn{padding:4px 8px;font-size:10px}.cuebtn.on{background:var(--cue);color:#000;border-color:var(--cue)}
.fxrow{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px;padding:0 6px 6px}
.fxu{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.fxu h4,.sampler h4{margin:0;font-size:11px;color:var(--mut)}
.fxu .fxc{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fxon{padding:12px 14px;font-weight:800}.fxon.on{background:var(--red);border-color:var(--red)}
.sampler{display:grid;grid-template-columns:1fr auto;gap:6px}
.spads{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.spads button{padding:9px 2px;font-size:11px}.spads button.hit{background:#c56cf0;color:#000}
.browser{display:grid;grid-template-columns:190px 1fr;gap:6px;padding:0 6px 6px;height:340px}
.side,.list{background:var(--p);border:1px solid var(--bd);border-radius:8px;overflow:auto;min-height:0}
.ti{padding:6px 10px;cursor:pointer;border-radius:4px;margin:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti:hover{background:var(--p2)}.ti.sel{background:var(--a1);color:#fff}.ti.drop{outline:1px dashed var(--a1)}
.th{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 2px;color:var(--mut);font-size:10px;letter-spacing:1px}
.th button{padding:1px 7px}
.list{display:flex;flex-direction:column}
.btool{display:flex;gap:5px;padding:6px;border-bottom:1px solid var(--bd);flex-wrap:wrap;position:sticky;top:0;background:var(--p);z-index:2}
.btool input{flex:1;min-width:120px}
.tw{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--p2);text-align:left;padding:5px 6px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;z-index:1}
td{padding:5px 6px;border-bottom:1px solid #1f1f26;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr{cursor:default}tr:hover td{background:#1c1c23}tr.sel td{background:#203a5e}
tr.l1 td:nth-child(2){box-shadow:inset 3px 0 var(--a1)}tr.l2 td:nth-child(2){box-shadow:inset 3px 0 var(--a2)}
tr.miss td{color:#666}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%}
.stars span{cursor:pointer;color:#444}.stars span.f{color:#ffd32a}
td.ld button{padding:2px 7px;font-size:10px}
.empty{padding:30px;text-align:center;color:var(--mut);line-height:1.7}
.menu{position:fixed;z-index:50;background:#1d1d24;border:1px solid #3a3a45;border-radius:6px;padding:4px;min-width:180px;box-shadow:0 8px 30px #000a}
.menu div{padding:7px 10px;border-radius:4px;cursor:pointer}.menu div:hover{background:var(--a1)}
.menu hr{border:0;border-top:1px solid #333;margin:4px}
.menu .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.dlgbg{position:fixed;inset:0;background:#000a;z-index:60;display:grid;place-items:center;padding:10px}
.dlg{background:var(--p);border:1px solid #3a3a45;border-radius:10px;padding:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;-webkit-user-select:text;user-select:text}
.dlg h3{margin:0 0 10px}.dlg label{display:block;margin:8px 0 3px;color:var(--mut)}.dlg input,.dlg select{width:100%}
.dlg .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
.dlg table td{white-space:normal}
.dlg kbd{background:var(--p3);border-radius:3px;padding:1px 5px}
body.learn [data-midi]{outline:1px dashed #c56cf0;outline-offset:1px;cursor:crosshair!important}
body.learn [data-midi].mapped{outline:1px solid #2bd665}
body.learn [data-midi].lsel{outline:3px solid #ffd32a!important}
#learnBar{position:fixed;top:0;left:0;right:0;z-index:65;background:#c56cf0;color:#000;padding:8px 12px;display:flex;gap:10px;align-items:center;font-weight:600}
#learnBar button{background:#000;color:#fff}
button.midiok{border-color:#2bd665;color:#2bd665}
.mtab td{padding:4px 6px}.mtab input{width:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:#2a2a33;padding:9px 16px;border-radius:20px;transition:.25s;z-index:70;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
.dsk{display:none}body.desktop .dsk{display:inline-block}
@media(max-width:1000px){
 .main{grid-template-columns:1fr}.mixer{order:3}#deck1{order:1}#deck2{order:2}
 .fxrow{grid-template-columns:1fr}.browser{grid-template-columns:1fr;height:auto}.side{max-height:160px}.tw{max-height:420px}
 .waves canvas{height:66px}
}
</style>
</head>
<body>
<header>
  <div class="logo">MIX<span>BOX</span></div>
  <button id="bImport">＋ Import</button>
  <button id="bFolder" class="dsk">＋ Folder</button>
  <button id="bShift" title="Shift (hold Shift key)">SHIFT</button>
  <button id="bQuant" class="on" title="Quantize cues/loops to the beat grid">QUANTIZE</button>
  <span class="hgrp">ZOOM <button id="bZm">−</button><button id="bZp">＋</button></span>
  <span class="mbpm">MASTER <b id="mbpm">---.--</b></span>
  <button id="bRec" class="rec">● REC</button><span id="recT"></span>
  <button id="bAudio">Audio</button>
  <button id="bMidi" title="MIDI controllers">MIDI</button>
  <button id="bPhone" class="dsk" title="Sync with the Mixbox phone app">📱 Phone</button>
  <button id="bMore">⋯</button>
  <input type="file" id="fIn" multiple accept="audio/*,.mp3,.wav,.aif,.aiff,.flac,.m4a,.aac,.ogg,.opus" hidden>
  <input type="file" id="fXml" accept=".xml,text/xml" hidden>
  <input type="file" id="fSamp" accept="audio/*" hidden>
</header>
<div class="waves"><canvas id="wz1"></canvas><canvas id="wz2"></canvas></div>
<div class="main">
  <div class="deck" id="deck1"></div>
  <div class="mixer" id="mixer"></div>
  <div class="deck" id="deck2"></div>
</div>
<div class="fxrow"><div class="fxu" id="fx1"></div><div class="sampler" id="sampler"></div><div class="fxu" id="fx2"></div></div>
<div class="browser">
  <div class="side" id="tree"></div>
  <div class="list">
    <div class="btool">
      <input type="search" id="search" placeholder="Search title, artist, genre, key…">
      <button id="bMatch" title="Show tracks harmonically compatible with the master deck">MATCH</button>
      <button id="bAuto" title="Automix the current list">AUTOMIX</button>
    </div>
    <div class="tw"><table><thead><tr>
      <th data-s="color"></th><th data-s="title">Title</th><th data-s="artist">Artist</th><th data-s="bpm">BPM</th><th data-s="key">Key</th><th data-s="dur">Time</th><th data-s="rating">Rating</th><th data-s="genre">Genre</th><th>Load</th>
    </tr></thead><tbody id="tb"></tbody></table><div id="empty" class="empty"></div></div>
  </div>
</div>
<div id="menu" class="menu" hidden></div>
<div id="dlg" class="dlgbg" hidden><div class="dlg" id="dlgIn"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================================
   Mixbox DJ — a rekordbox-style two-deck DJ application.
   Runs in a browser or inside the Electron shell (window.mixbox bridge).
   ========================================================================= */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const BR = window.mixbox || null;
if (BR) document.body.classList.add('desktop');
const DPR = () => window.devicePixelRatio || 1;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const AUDIO_RE = /\.(mp3|wav|wave|aiff?|flac|m4a|aac|ogg|oga|opus|mp4)$/i;
function fmt(t, neg) { if (!isFinite(t) || t < 0) t = 0; const m = Math.floor(t / 60); const s = Math.floor((t - m * 60) * 10) / 10; return (neg ? '-' : '') + m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400); }

/* ---------------- Keys (Camelot) ---------------- */
const MAJ = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const MIN = ['Cm','C#m','Dm','Ebm','Em','Fm','F#m','Gm','G#m','Am','Bbm','Bm'];
const CAM_MAJ = [8,3,10,5,12,7,2,9,4,11,6,1], CAM_MIN = [5,12,7,2,9,4,11,6,1,8,3,10];
function keyInfo(pc, minor) { return { key: (minor ? CAM_MIN : CAM_MAJ)[pc] + (minor ? 'A' : 'B'), keyName: (minor ? MIN : MAJ)[pc] }; }
function parseKey(s) {
  s = String(s || '').trim(); if (!s) return null;
  let m = s.match(/^0?(\d{1,2})\s*([ABab])$/);
  if (m) { const n = +m[1], minor = m[2].toUpperCase() === 'A'; const pc = (minor ? CAM_MIN : CAM_MAJ).indexOf(n); if (pc >= 0) return keyInfo(pc, minor); }
  m = s.match(/^([A-Ga-g])([#b♯♭]?)\s*(m|min|minor|maj|major)?$/);
  if (m) {
    let pc = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()] + (m[2] === '#' || m[2] === '♯' ? 1 : m[2] === 'b' || m[2] === '♭' ? -1 : 0);
    pc = (pc + 12) % 12; const q = (m[3] || '').toLowerCase();
    return keyInfo(pc, q === 'm' || q === 'min' || q === 'minor');
  }
  return null;
}
const keyColor = k => { const n = parseInt(k); return isNaN(n) ? '#888' : `hsl(${((n - 1) * 30 + 120) % 360},80%,62%)`; };
function keyCompat(a, b) {
  const na = parseInt(a), nb = parseInt(b); if (isNaN(na) || isNaN(nb)) return false;
  const la = a.slice(-1), lb = b.slice(-1);
  if (na === nb) return true;
  return la === lb && (((na - nb + 12) % 12) === 1 || ((nb - na + 12) % 12) === 1);
}

/* ---------------- DSP: FFT, BPM, key ---------------- */
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), h = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let j = 0; j < h; j++) {
        const a = i + j, b = a + h, tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
}
// Tempo + beat phase from an onset-strength envelope O sampled at Ro Hz.
function detectBPM(O, Ro) {
  const N = O.length; if (N < Ro * 4) return null;
  const w = Math.round(Ro * 0.25), cs = new Float64Array(N + 1), P = new Float32Array(N);
  for (let i = 0; i < N; i++) cs[i + 1] = cs[i] + O[i];
  for (let i = 0; i < N; i++) { const a = Math.max(0, i - w), b = Math.min(N, i + w + 1); P[i] = Math.max(0, O[i] - (cs[b] - cs[a]) / (b - a)); }
  const lmin = Math.floor(Ro * 60 / 200), lmax = Math.ceil(Ro * 60 / 60), ac = new Float64Array(lmax + 2);
  for (let l = lmin - 1; l <= lmax + 1; l++) { let s = 0; for (let i = 0; i + l < N; i++) s += P[i] * P[i + l]; ac[l] = s / (N - l); }
  let best = -1, bl = lmin;
  for (let l = lmin; l <= lmax; l++) {
    const bpm = 60 * Ro / l, wt = Math.exp(-0.5 * Math.pow(Math.log2(bpm / 125) / 0.9, 2)), v = ac[l] * wt;
    if (v > best && ac[l] >= ac[l - 1] && ac[l] >= ac[l + 1]) { best = v; bl = l; }
  }
  const a = ac[bl - 1], b = ac[bl], c = ac[bl + 1], den = a - 2 * b + c;
  let bpm = 60 * Ro / (bl + (den ? 0.5 * (a - c) / den : 0));
  while (bpm < 78) bpm *= 2; while (bpm >= 180) bpm /= 2;
  const H = new Float64Array(64);
  const score = x => {
    const per = Ro * 60 / x; H.fill(0);
    for (let i = 0; i < N; i++) { const ph = (i % per) / per; H[(ph * 64) | 0] += P[i]; }
    let mx = -1, mi = 0;
    for (let k = 0; k < 64; k++) { const v = H[(k + 63) & 63] * 0.5 + H[k] + H[(k + 1) & 63] * 0.5; if (v > mx) { mx = v; mi = k; } }
    return { s: mx, bin: mi };
  };
  let bs = -1, bb = bpm, bbin = 0;
  for (let x = bpm - 2; x <= bpm + 2; x += 0.01) { const r = score(x); if (r.s > bs) { bs = r.s; bb = x; bbin = r.bin; } }
  // half/double-time check: if every off-beat is as strong as the beat, it's really double tempo
  if (bb * 2 < 180) { const s1 = score(bb).s, s2 = score(bb * 2); if (s2.s > 1.5 * s1) { bb *= 2; bbin = s2.bin; } }
  if (Math.abs(bb - Math.round(bb)) < 0.06) { bb = Math.round(bb); bbin = score(bb).bin; }
  bb = Math.round(bb * 100) / 100;
  const per = Ro * 60 / bb, phase = ((bbin + 0.5) / 64) * per; // in frames
  // downbeat: choose which of 4 beats carries most onset energy
  let bestK = 0, bestE = -1;
  for (let k = 0; k < 4; k++) { let e = 0; for (let f = phase + k * per; f < N; f += 4 * per) { const c = Math.round(f); let mx = 0; for (let j = c - 2; j <= c + 2; j++) if (P[j] > mx) mx = P[j]; e += mx; } if (e > bestE) { bestE = e; bestK = k; } }
  return { bpm: bb, gridFrames: phase + bestK * per };
}
// Krumhansl-Schmuckler key from a 12-bin chroma vector.

  if (!t || !t.wf) { g.fillStyle = '#555'; g.font = `${11 * dp}px system-ui`; g.fillText(`DECK ${d.n}` + (t && !t.wf ? ' — analyzing…' : ''), 10 * dp, H / 2 + 4 * dp); return; }

function buildOverview(d) {
  const c = d.ui.ov; sizeCanvas(c); const W = c.width, H = c.height, t = d.track;

  buildOverview(d); const c = d.ui.ov, g = c.getContext('2d'), W = c.width, H = c.height, dp = DPR();

/* ---------------- Automix ---------------- */
const AM = { on: false, list: [], idx: -1, active: null, mixing: false, mixStart: 0, mixDur: 0, loading: false };
async function amStart() {
  AM.list = viewIds().filter(id => !LIB.tracks.get(id).missing);
  if (AM.list.length < 2) { toast('Automix needs at least 2 tracks in the list'); AM.on = false; return; }
  AM.on = true; AM.mixing = false;
  const p = decks.find(d => d.playing);
  if (p) { AM.active = p; AM.idx = Math.max(0, AM.list.indexOf(p.track.id)); }
  else { AM.idx = 0; await loadToDeck(decks[0], AM.list[0]); MIX.xf.set(-1); decks[0].play(); AM.active = decks[0]; }
  toast('Automix on');
}
function amTick() {
  if (!AM.on || !AM.active) return;
  const A = AM.active, B = decks[1 - A.i], nid = AM.list[AM.idx + 1];
  if (nid == null) { if (!A.playing) { AM.on = false; $('bAuto').classList.remove('on'); toast('Automix finished'); } return; }
  if (!AM.mixing && !AM.loading && !B.playing && (!B.track || B.track.id !== nid)) { AM.loading = true; loadToDeck(B, nid).finally(() => AM.loading = false); return; }
  if (!A.buffer) return;
  const beat = A.bpm ? 60 / A.curBPM : 0.5, mixDur = Math.min(32 * beat, 20), remain = (A.dur - A.pos()) / A.effRate;
  if (!AM.mixing && B.buffer && !AM.loading && B.track.id === nid && remain <= mixDur + 1) {
    if (A.bpm && B.bpm) B.setTempoBPM(A.curBPM);
    B.offset = B.bpm ? B.qFloor(Math.max(B.track.firstSound || 0, B.grid)) : (B.track.firstSound || 0);
    B.play(); if (A.bpm && B.bpm) B.phaseAlign(A);
    AM.mixing = true; AM.mixStart = ctx.currentTime; AM.mixDur = Math.max(2, Math.min(mixDur, remain));
  }
  if (AM.mixing) {
    const f = clamp((ctx.currentTime - AM.mixStart) / AM.mixDur, 0, 1);
    MIX.xf.set(A.i === 0 ? -1 + 2 * f : 1 - 2 * f);
    if (f >= 1 || !A.playing) { A.pause(); AM.active = B; AM.idx++; AM.mixing = false; B.setMaster(); }
  }
}

function viewIds() {
  let ids;
  if (VIEW.v === 'col') ids = LIB.order.slice();
  else if (VIEW.v === 'hist') ids = [...new Set(LIB.history.slice().reverse())];
  else { const p = LIB.playlists.find(p => 'pl:' + p.id === VIEW.v); ids = p ? p.ids.slice() : []; }
  ids = ids.filter(id => LIB.tracks.has(id));
  const q = VIEW.q.trim().toLowerCase();
  if (q) ids = ids.filter(id => { const t = LIB.tracks.get(id); return [t.title, t.artist, t.album, t.genre, t.key, t.keyName, t.comment, t.name].join(' ').toLowerCase().includes(q); });
  if (VIEW.match) {
    const m = masterDeck() || decks.find(d => d.track);
    if (m && m.track) {
      const mk = m.track.key, mb = m.curBPM || m.bpm;
      ids = ids.filter(id => { const t = LIB.tracks.get(id); if (t === m.track) return false; const kOK = !mk || !t.key || keyCompat(mk, t.key); let r = t.bpm && mb ? mb / t.bpm : 1; while (r > 1.45) r /= 2; while (r < 0.7) r *= 2; return kOK && Math.abs(r - 1) < 0.08; });
    }

  if (VIEW.sort) {
    const k = VIEW.sort, dir = VIEW.dir;
    ids.sort((a, b) => { let x = LIB.tracks.get(a)[k], y = LIB.tracks.get(b)[k]; if (k === 'key') { x = parseInt(x) * 2 + (String(x).endsWith('B') ? 1 : 0) || 99; y = parseInt(y) * 2 + (String(y).endsWith('B') ? 1 : 0) || 99; } if (typeof x === 'string' || typeof y === 'string') return String(x || '').localeCompare(String(y || '')) * dir; return ((x || 0) - (y || 0)) * dir; });
  }

}

const PUBLIC_FIELDS = ['id', 'title', 'artist', 'album', 'genre', 'comment', 'bpm', 'grid', 'key', 'keyName', 'dur', 'rating', 'color', 'added', 'plays', 'hot', 'cue', 'status', 'missing', 'name'];
function libraryForPhone() {
  const tracks = LIB.order.filter(id => LIB.tracks.has(id)).map(id => { const t = LIB.tracks.get(id), o = {}; PUBLIC_FIELDS.forEach(k => { if (t[k] !== undefined && t[k] !== '') o[k] = t[k]; }); o.file = !!t.path; return o; });
  return { ver: LIB.ver, tracks, playlists: LIB.playlists, history: LIB.history.slice(-300), loaded: decks.map(d => d.track ? d.track.id : null) };
}
function applyPhoneOps(ops) {
  const EDIT = ['rating', 'color', 'title', 'artist', 'album', 'genre', 'comment', 'bpm', 'cue', 'hot'];
  for (const o of ops || []) {
    if (o.op === 'track') {
      const t = LIB.tracks.get(o.id); if (!t) continue;
      for (const k of EDIT) if (o.set && k in o.set) t[k] = o.set[k];
      if (o.set && o.set.keyName) { const k = parseKey(o.set.keyName); if (k) Object.assign(t, k); }
      saveTrack(t); decks.forEach(d => { if (d.track === t) { d.refresh(); if ('bpm' in o.set) afterBpmChange(d); } });
    } else if (o.op === 'pl.create') { if (!LIB.playlists.some(p => p.id === o.id)) LIB.playlists.push({ id: o.id || uid(), name: String(o.name || 'Playlist'), ids: (o.ids || []).filter(i => LIB.tracks.has(i)) }); }
    else {
      const p = LIB.playlists.find(p => p.id === o.id); if (!p) continue;
      if (o.op === 'pl.rename') p.name = String(o.name || p.name);
      else if (o.op === 'pl.delete') { LIB.playlists = LIB.playlists.filter(x => x !== p); if (VIEW.v === 'pl:' + p.id) VIEW.v = 'col'; }
      else if (o.op === 'pl.set') p.ids = (o.ids || []).filter(i => LIB.tracks.has(i));
      else if (o.op === 'pl.add') (o.ids || []).forEach(i => { if (LIB.tracks.has(i) && !p.ids.includes(i)) p.ids.push(i); });
      else if (o.op === 'pl.remove') p.ids = p.ids.filter(i => !(o.ids || []).includes(i));
    }
  }
  saveMeta(); renderBrowser();
  return { ver: LIB.ver };
}
function waveForPhone(id) {
  const t = LIB.tracks.get(id); if (!t || !t.wf) return null;
  const W = 400, wf = t.wf, ds = a => { const o = []; for (let x = 0; x < W; x++) { let m = 0; for (let i = Math.floor(x / W * wf.n), e = Math.floor((x + 1) / W * wf.n); i < e; i++) if (a[i] > m) m = a[i]; o.push(m); } return o; };
  return { low: ds(wf.low), mid: ds(wf.mid), high: ds(wf.high) };
}
if (BR && BR.onSyncRequest) BR.onSyncRequest(async (method, args) => {
  if (method === 'library') return libraryForPhone();
  if (method === 'ops') return applyPhoneOps(args);
  if (method === 'wave') return waveForPhone(args);
  if (method === 'path') { const t = LIB.tracks.get(args); return t ? t.path : ''; }
  if (method === 'import') {
    const t = newTrack(args.path.split(/[\\/]/).pop(), args.path); addTrack(t); enqueue(t);
    if (args.playlist) { const p = LIB.playlists.find(p => p.id === args.playlist); if (p) p.ids.push(t.id); }
    saveMeta(); renderBrowser(); toast('Received from phone: ' + t.title);
    return { id: t.id };
  }
  throw new Error('unknown method');
});
async function phoneDialog() {
  if (!BR || !BR.syncStart) return toast('Phone sync runs in the desktop app');
  const render = info => showDialog(`<h3>📱 Phone sync</h3>
    ${info.running ? `<p>On your phone (same Wi-Fi), open:</p>${info.urls.map(u => `<div style="font-size:20px;font-weight:700;margin:6px 0;-webkit-user-select:all;user-select:all">${esc(u)}</div>`).join('') || '<p>No network found — connect this computer to Wi-Fi.</p>'}
      <p>Pairing PIN: <b style="font-size:26px;letter-spacing:4px">${esc(info.pin)}</b></p>
      <p style="color:var(--mut)">Then use Share → <b>Add to Home Screen</b> to keep it as an app. Every edit on the phone (playlists, order, ratings, colors, tags, cues) lands here instantly, and the other way round. Tracks you upload from the phone are copied into Music/Mixbox Uploads and analyzed.</p>`
      : `<p>Turn on sync to organize this library from your phone over Wi-Fi.</p>`}
    <div class="acts">${info.running ? '<button id="syOff">Stop sync</button>' : '<button id="syOn" class="on">Start sync</button>'}<button data-close>Close</button></div>`, () => {
      if ($('syOn')) $('syOn').onclick = async () => render(await BR.syncStart());
      if ($('syOff')) $('syOff').onclick = async () => render(await BR.syncStop());
    });
  render(await BR.syncInfo());
}
$('bPhone').onclick = phoneDialog;

/* ---------------- Main loop ---------------- */
let lastFx = 0;
function frame() {
  decks.forEach(d => {
    const ui = d.ui, p = d.pos();
    drawZoom(d); drawOverview(d); drawJog(d); drawVU($('m' + d.n + 'vu'), d.an);
    ui.el.textContent = fmt(p); ui.rem.textContent = fmt(d.dur - p, true);
    ui.bpm.textContent = d.bpm ? d.curBPM.toFixed(2) : '---.--';
    ui.pct.textContent = (d.tempoPct >= 0 ? '+' : '') + d.tempoPct.toFixed(2) + '%'; ui.tp.textContent = ui.pct.textContent;
    if (d.bpm && d.buffer) { const bi = Math.floor((p - d.grid) / d.beat + 1e-4), bar = Math.floor(bi / 4) + 1, bt = ((bi % 4) + 4) % 4; ui.beats.forEach((b, i) => b.classList.toggle('on', i === bt)); ui.bar.textContent = `${bar}.${bt + 1}`; }
    else { ui.beats.forEach(b => b.classList.remove('on')); ui.bar.textContent = '--'; }
    const playOn = d.playing && !d.previewing; if (playOn !== ui._p) { ui._p = playOn; d.refresh(); }
  });
  drawVU($('mvuL'), M.an);
  const m = masterDeck(); $('mbpm').textContent = m && m.bpm ? m.curBPM.toFixed(2) : '---.--';
  if (REC) { const s = (performance.now() - REC.t0) / 1000; $('recT').textContent = Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
  const now = performance.now(); if (now - lastFx > 400) { lastFx = now; fxUnits.forEach(u => u.update()); decks.forEach(d => d.refresh()); }
  amTick();
  if (now - MIDI.lastLed > 80) { MIDI.lastLed = now; midiLedTick(); }
  requestAnimationFrame(frame);
}

/* ---------------- Boot ---------------- */
(async function boot() {
  decks.forEach(buildDeckUI); buildMixer(); fxUnits.forEach(buildFX); buildSampler();
  await DB.open();
  const all = await DB.all('tracks'); all.forEach(t => { t.status = t.wf ? 'ready' : 'pending'; LIB.tracks.set(t.id, t); });
  const meta = await DB.get('meta', 'lib');
  if (meta) { LIB.order = (meta.order || []).filter(id => LIB.tracks.has(id)); LIB.playlists = meta.playlists || []; LIB.history = meta.history || []; }
  all.forEach(t => { if (!LIB.order.includes(t.id)) LIB.order.push(t.id); });
  renderBrowser();
  buildTargets(); tagMidiTargets(); await loadMidi();
  if (BR) initMIDI(true); else if (navigator.permissions) navigator.permissions.query({ name: 'midi' }).then(r => { if (r.state === 'granted') initMIDI(true); }).catch(() => {});
  requestAnimationFrame(frame);
  synthSamples();
})();
</script>
